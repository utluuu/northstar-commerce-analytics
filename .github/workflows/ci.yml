name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r python/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q data_generator python scripts tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Audit repository delivery assets
        run: python scripts/check_repository.py
